[build-system]
requires = ["hatchling==1.32.4", "packaging==26.3", "pathspec==1.1.1", "pluggy==1.6.0", "trove-classifiers==2026.9.21.13", "tomlkit==0.15.1"]
build-backend = "hatchling.build"

[project]
name = "piccolo-stack"
version = "0.1.0a1"
description = "Declarative infrastructure utility for GCP development environments"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "annotated-doc==0.0.5",
    "colorama==0.4.6",
    "markdown-it-py==4.2.0",
    "mdurl==0.1.2",
    "pygments==2.21.0",
    "rich==15.0.0",
    "shellingham==1.5.4",
    "termcolor==3.3.0",
    "typer==0.27.3",
    "yaspin==3.5.1",
]

[project.scripts]
piccolo = "piccolo.cli:main"

# Transitive requirements are pinned as well so pip cannot select older runtime packages.
[project.optional-dependencies]
gcp = [
    "certifi==2026.7.22",
    "cffi==2.1.1",
    "charset-normalizer==3.5.2",
    "cryptography==50.0.2",
    "google-api-core==2.42.0",
    "google-auth==2.61.0",
    "google-cloud-compute==1.55.0",
    "google-cloud-iam==2.26.0",
    "google-cloud-resource-manager==1.19.0",
    "google-cloud-secret-manager==2.31.0",
    "google-cloud-service-usage==1.18.0",
    "googleapis-common-protos==1.75.5",
    "grpc-google-iam-v1==0.14.5",
    "grpcio==1.84.0",
    "grpcio-status==1.84.0",
    "idna==3.20",
    "opentelemetry-api==1.45.1",
    "proto-plus==1.29.0",
    "protobuf==7.36.2",
    "pyasn1==0.6.4",
    "pyasn1-modules==0.4.2",
    "pycparser==3.11",
    "requests==2.34.2",
    "typing-extensions==4.16.0",
    "urllib3==2.8.0",
]

[dependency-groups]
dev = [
    "build==1.6.1",
    "cfgv==3.5.0",
    "distlib==0.4.3",
    "docutils==0.23",
    "filelock==4.1.0",
    "id==1.6.1",
    "identify==2.6.20",
    "iniconfig==2.3.1",
    "jaraco-classes==3.4.0",
    "jaraco-context==6.1.2",
    "jaraco-functools==4.6.0",
    "jeepney==0.9.0; sys_platform == 'linux'",
    "keyring==25.7.0",
    "more-itertools==11.1.0",
    "nh3==0.3.7",
    "nodeenv==1.11.0",
    "packaging==26.3",
    "platformdirs==4.12.4",
    "pluggy==1.6.0",
    "pre-commit==4.6.2",
    "pyproject-hooks==1.3.3",
    "pyrefly==1.3.2",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "coverage==7.16.2",

    "python-discovery==1.6.2",
    "pywin32-ctypes==0.2.3; sys_platform == 'win32'",
    "pyyaml==6.0.3",
    "readme-renderer==46.0",
    "requests-toolbelt==1.0.0",
    "rfc3986==2.0.0",
    "ruff==0.17.0",
    "secretstorage==3.5.0; sys_platform == 'linux'",
    "twine==7.0.0",
    "virtualenv==21.14.6",
    "pathspec==1.1.1",
    "tomlkit==0.15.1",
    "trove-classifiers==2026.9.21.13",
    "hatchling==1.32.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/piccolo"]
include = ["src/piccolo/**/*.py"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml", "justfile", "uv.lock"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D", "ANN", "PGH", "ARG"]
ignore = [
    "D100", # missing docstring in public module
    "D104", # missing docstring in public package
    "D203", # conflicts with D211
    "D212", # conflicts with D213
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyrefly]
preset = "strict"
python-version = "3.12"
project-includes = ["src"]
search-path = [".", "tests"]
min-severity = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["gcp_live: opt-in disposable-project GCP tests, excluded by default"]

[tool.coverage.run]
source = ["src/piccolo"]
