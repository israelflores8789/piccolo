[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "piccolo"
version = "0.1.0"
description = "Declarative infrastructure utility for GCP development environments"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pyrefly>=0.20",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/piccolo"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D", "ANN", "PGH", "ARG"]
ignore = [
    "D100", # missing docstring in public module
    "D104", # missing docstring in public package
    "D203", # conflicts with D211
    "D212", # conflicts with D213
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyrefly]
preset = "strict"
python-version = "3.12"
project-includes = ["src"]
search-path = ["."]
min-severity = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src/piccolo"]
