[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "piccolo"
version = "0.1.0"
description = "Declarative infrastructure utility for GCP development environments"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["typer>=0.16", "yaspin>=3.1"]

[project.scripts]
piccolo = "piccolo.cli:main"

[project.optional-dependencies]
gcp = [
    "google-cloud-compute>=1.30",
    "google-cloud-secret-manager>=2.20",
    "google-cloud-resource-manager>=1.12",
    "google-cloud-iam>=2.18",
    "google-cloud-service-usage>=1.10",
    "google-auth>=2.35",
]

[dependency-groups]
dev = [
    "build>=1.2",
    "pre-commit>=4.0",
    "pyrefly>=0.20",
    "pytest>=8.0",
    "ruff>=0.8",
    "twine>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/piccolo"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "NEXTSTEPS.md", "CHANGELOG.md", "LICENSE", "pyproject.toml", "justfile", "uv.lock"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D", "ANN", "PGH", "ARG"]
ignore = [
    "D100", # missing docstring in public module
    "D104", # missing docstring in public package
    "D203", # conflicts with D211
    "D212", # conflicts with D213
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyrefly]
preset = "strict"
python-version = "3.12"
project-includes = ["src"]
search-path = [".", "tests"]
min-severity = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["gcp_live: opt-in disposable-project GCP tests, excluded by default"]

[tool.coverage.run]
source = ["src/piccolo"]
