name: CI

on:
  push:
    branches:
    - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Local tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-15]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      UV_PYTHON: ${{ matrix.python }}
    timeout-minutes: 20
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}

    - name: Set up uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: true

    - name: Set up just
      uses: extractions/setup-just@v4

    - name: Install development dependencies
      run: uv sync --locked --all-groups --extra gcp

    - name: Set up GNU guest utilities on macOS
      if: runner.os == 'macOS'
      run: |
        brew install coreutils
        guest_bin="$(brew --prefix coreutils)/libexec/gnubin"
        echo "$guest_bin" >> "$GITHUB_PATH"
        echo "PICCOLO_GUEST_BIN=$guest_bin" >> "$GITHUB_ENV"

    - name: Run unit tests
      uses: pavelzw/pytest-action@v2
      with:
        verbose: true
        emoji: true
        job-summary: true
        report-title: "Piccolo unit tests"
        # Restore GNU tools after the action's login shell runs its startup files.
        custom-pytest: env PATH="${PICCOLO_GUEST_BIN:+$PICCOLO_GUEST_BIN:}$PATH" uv run --locked --with pytest-md==0.2.0 --with pytest-emoji==0.2.0 pytest
        custom-arguments: '--capture=fd -m "not gcp_live and not gcp_win_live" --junitxml=junit.xml -o junit_logging=all -o junit_log_passing_tests=false'

    - name: Save JUnit test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: junit-unit-test-results-${{ matrix.os }}-${{ matrix.python }}
        path: junit.xml
        if-no-files-found: warn
        retention-days: 14

  lint:
    name: Lint and type check
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Set up uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: true

    - name: Set up just
      uses: extractions/setup-just@v4

    - name: Install development dependencies
      run: uv sync --locked --all-groups --extra gcp

    - name: Check formatting and lint
      run: just lint

    - name: Check types
      run: just typecheck

  build:
    name: Build and validate distributions
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Set up uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: true

    - name: Install development dependencies
      run: uv sync --locked --all-groups

    - name: Build distributions
      run: uv build --no-sources

    - name: Validate distributions
      run: uv run --locked twine check --strict dist/*

  gate:
    name: CI gate
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # Add each blocking CI job to this list and the result check below.
    needs: [unit, lint, build]
    if: always()
    steps:
    - name: Evaluate results
      env:
        UNIT: ${{ needs.unit.result }}
        LINT: ${{ needs.lint.result }}
        BUILD: ${{ needs.build.result }}
      run: |
        set -euo pipefail
        echo "unit=$UNIT lint=$LINT build=$BUILD"
        for result in "$UNIT" "$LINT" "$BUILD"; do
          [ "$result" = "success" ] || exit 1
        done
